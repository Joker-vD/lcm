<html>
<head>
    <meta charset="utf-8">
    <title>LCM calculator</title>
    <script type="text/javascript">
        "use strict";

        let setResultText = (element, text) => {
            if (text === undefined) {
                element.innerText = "—";
                element.classList.replace("selectable", "unselectable");
            } else {
                element.innerText = text;
                element.classList.replace("unselectable", "selectable");
            }
        }

        let gcd = (a, b) => {
            if (!isFinite(a) || !isFinite(b)) return Number.NaN;
            if (a < 0) a = -a;
            if (b < 0) b = -b;

            [a, b] = [Math.min(a, b), Math.max(a, b)];

            while (a != 0) {
                [a, b] = [b % a, a];
            }

            return b;
        }


        let recalc = (how) => {
            let a = inA.valueAsNumber;
            let b = inB.valueAsNumber;
            let lcm = a * b / gcd(a, b);
            if (Number.isFinite(lcm)) {
                setResultText(textLCM, lcm);
                setResultText(textMulA, lcm / a);
                setResultText(textMulB, lcm / b);
            } else if (how == "force") {
                setResultText(textLCM);
                setResultText(textMulA);
                setResultText(textMulB);
            }
        }
    </script>
    <style>

body {
    font-size: 16px;
    font-family: Arial, sans-serif;
}

input {
    font-size: 16px;
}

.center-screen {
    display: flex;
    justify-content: center;
    align-items: center;
    height: 95vh;
}

.align-left {
    display: flex;
    flex-direction: column;
    text-align: left;
    gap: 20px;
}

.unselectable {
    user-select: none;
}

.selectable {
    user-select: all;
    font-size: 18px;
    font-weight: bold;
}
    </style>
</head>
<body class="center-screen">
    <div class="align-left">
        <div>
            <label for="inA" class="unselectable">Number #1:</label>
            <input id="inA" type="number" oninput="recalc()" onchange="recalc('force')" autofocus>
        </div>
        <div>
            <label for="inB" class="unselectable">Number #2:</label>
            <input id="inB" type="number" oninput="recalc()" onchange="recalc('force')">
        </div>
        <span class="unselectable">LCM is <span id="textLCM" class="unselectable">—</span></span>
        <span class="unselectable">Multiplier for number #1 is <span id="textMulA" class="unselectable">—</span></span>
        <span class="unselectable">Multiplier for number #2 is <span id="textMulB" class="unselectable">—</span></span>
    </div>
</body>
</html>
